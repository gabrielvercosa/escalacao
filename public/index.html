<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalação</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='21' fill='none' stroke='%232f6f4f' stroke-width='2.4'/%3E%3Cpath d='M24 13.5 31 19l-2.7 8.4h-8.6L17 19z' fill='%232f6f4f'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Barlow+Condensed:wght@600;700&display=swap');

  :root{
    --bg:#f5f2e8;
    --surface:#ffffff;
    --surface-2:#eee7d4;
    --ink:#182a20;
    --ink-dim:#5c6a5f;
    --line:rgba(24,42,32,.14);
    --line-strong:rgba(24,42,32,.28);
    --pitch:#2f6f4f;
    --pitch-ink:#0f2c1e;
    --gold:#b9852f;
    --gold-soft:rgba(185,133,47,.16);
    --danger:#a6402f;
    --danger-soft:rgba(166,64,47,.12);
    --team-a:#2f6f4f;
    --team-a-soft:rgba(47,111,79,.12);
    --team-b:#b5591f;
    --team-b-soft:rgba(181,89,31,.12);
    --team-c:#2b5f8a;
    --team-c-soft:rgba(43,95,138,.12);
    --shadow:0 1px 2px rgba(24,42,32,.06), 0 8px 24px -12px rgba(24,42,32,.18);
    color-scheme:light;
    background:var(--bg);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1a13;
      --surface:#132318;
      --surface-2:#1a2e20;
      --ink:#eef2ea;
      --ink-dim:#a3b3a6;
      --line:rgba(238,242,234,.12);
      --line-strong:rgba(238,242,234,.24);
      --pitch:#5aab7c;
      --pitch-ink:#cfe9da;
      --gold:#e0b455;
      --gold-soft:rgba(224,180,85,.16);
      --danger:#e08067;
      --danger-soft:rgba(224,128,103,.14);
      --team-a:#5aab7c;
      --team-a-soft:rgba(90,171,124,.16);
      --team-b:#e08a4a;
      --team-b-soft:rgba(224,138,74,.16);
      --team-c:#6fa8d8;
      --team-c-soft:rgba(111,168,216,.16);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1a13;
    --surface:#132318;
    --surface-2:#1a2e20;
    --ink:#eef2ea;
    --ink-dim:#a3b3a6;
    --line:rgba(238,242,234,.12);
    --line-strong:rgba(238,242,234,.24);
    --pitch:#5aab7c;
    --pitch-ink:#cfe9da;
    --gold:#e0b455;
    --gold-soft:rgba(224,180,85,.16);
    --danger:#e08067;
    --danger-soft:rgba(224,128,103,.14);
    --team-a:#5aab7c;
    --team-a-soft:rgba(90,171,124,.16);
    --team-b:#e08a4a;
    --team-b-soft:rgba(224,138,74,.16);
    --team-c:#6fa8d8;
    --team-c-soft:rgba(111,168,216,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{
    margin:0;
    color:var(--ink);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}

  /* ---------- header ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .ball{width:38px;height:38px;flex:none}
  h1{
    font-family:'Anton',system-ui,sans-serif;
    font-weight:400;
    font-size:clamp(28px,5vw,38px);
    letter-spacing:.01em;
    margin:0;
    text-transform:uppercase;
    line-height:.95;
    text-wrap:balance;
  }
  .tagline{margin:4px 0 0;color:var(--ink-dim);font-size:14px;font-weight:500}
  .tagline b{color:var(--ink);font-weight:600}

  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;text-align:center;box-shadow:var(--shadow);min-width:84px;
  }
  .stat .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
  .stat .l{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  /* ---------- admin gate ---------- */
  .admin-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
  .admin-pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim)}
  .admin-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--pitch);flex:none}
  .link-btn{
    background:none;border:none;padding:0;color:var(--pitch);font-weight:600;font-size:13px;
    text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:inherit;
  }
  .link-btn:hover{color:var(--ink)}
  .admin-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .admin-form input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:13.5px;color:var(--ink);font-family:inherit;width:150px;
  }
  .admin-form input:focus{outline:2px solid var(--pitch);outline-offset:1px;border-color:transparent}

  /* ---------- caixa da pelada ---------- */
  .cash-card{margin-bottom:18px}
  .cash-inner{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 20px}
  .cash-label{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
    text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);width:100%;
  }
  .cash-value{font-family:'Anton',sans-serif;font-weight:400;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
  .cash-meta{font-size:12.5px;color:var(--ink-dim)}
  .cash-edit-btn{margin-left:auto}
  .cash-edit-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
  .cash-prefix{font-weight:700;color:var(--ink-dim)}
  .cash-edit-form input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:16px;width:130px;font-family:inherit;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .cash-edit-form input:focus{outline:2px solid var(--pitch);outline-offset:1px;border-color:transparent}

  /* ---------- banner ---------- */
  .banner{
    display:flex;align-items:center;gap:10px;
    background:var(--gold-soft);border:1px solid rgba(185,133,47,.35);
    color:var(--ink);font-size:13.5px;font-weight:500;
    border-radius:10px;padding:10px 14px;margin-bottom:18px;
  }
  .banner.offline{background:var(--danger-soft);border-color:rgba(166,64,47,.35)}
  .banner strong{font-weight:700}

  /* ---------- add form ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);
  }
  .add-form{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:14px 16px;margin-bottom:16px;
  }
  .add-form input[type=text]{
    flex:1 1 200px;min-width:160px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:15px;color:var(--ink);font-family:inherit;
  }
  .add-form input[type=text]:focus{outline:2px solid var(--pitch);outline-offset:1px;border-color:transparent}
  .add-form .stars-pick{display:flex;gap:2px;align-items:center;padding:0 4px}
  button{font-family:inherit;cursor:pointer}
  .btn{
    border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;
    background:var(--pitch);color:#fff;transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:var(--surface-2);color:var(--ink-dim);cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--pitch);color:var(--pitch)}
  .btn.small{padding:6px 12px;font-size:12px}

  /* ---------- star widget ---------- */
  .star-btn{background:none;border:none;padding:2px;line-height:0;display:inline-flex}
  .star-btn svg{width:18px;height:18px;display:block}
  .star-btn .fill{fill:var(--gold)}
  .star-btn .empty{fill:none;stroke:var(--ink-dim);stroke-width:1.6}
  .star-btn:not([disabled]):hover .empty{stroke:var(--gold)}

  /* ---------- roster ---------- */
  .roster-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
  .roster-head h2{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
    text-transform:uppercase;letter-spacing:.09em;color:var(--ink-dim);margin:0;
  }
  .example-tag{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}

  .row-head{
    display:flex;align-items:center;gap:14px;padding:8px 16px;
    font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  }
  .row-head .c-name{flex:1 1 auto}
  .row-head .c-stars{width:158px;flex:none}
  .row-head .c-active{width:64px;flex:none;text-align:center}
  .row-head .c-del{width:70px;flex:none}
  @media (max-width:640px){ .row-head{display:none} }

  .player-row{display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:1px solid var(--line)}
  .player-row:first-of-type{border-top:none}
  .player-row.inactive{opacity:.5}
  .player-row .c-name{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px}
  .p-name-input{
    flex:1 1 auto;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;
    padding:5px 6px;margin:-5px -6px;font-size:15.5px;font-weight:600;color:var(--ink);font-family:inherit;
  }
  .p-name-input:hover{background:var(--surface-2)}
  .p-name-input:focus{outline:none;border-color:var(--pitch);background:var(--surface-2)}

  /* ---------- forma (setinhas de tendência) ---------- */
  .trend-badge{flex:none;font-size:10px;font-weight:800;letter-spacing:-1px;line-height:1}
  .trend-badge.up{color:var(--pitch)}
  .trend-badge.down{color:var(--danger)}
  .trend-picker{display:flex;gap:3px;flex:none}
  .trend-btn{
    background:none;border:1px solid var(--line);border-radius:6px;padding:3px 7px;
    font-size:11px;line-height:1;color:var(--ink-dim);
  }
  .trend-btn:hover{border-color:var(--line-strong)}
  .trend-btn.up.active{background:var(--team-a-soft);color:var(--pitch);border-color:var(--pitch)}
  .trend-btn.down.active{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
  .c-trend{width:56px;flex:none;display:flex;justify-content:center}
  .row-head .c-trend{width:56px;flex:none;text-align:center}
  .c-stars{width:158px;flex:none;display:flex;gap:1px}
  .c-active{width:64px;flex:none;display:flex;justify-content:center}
  .c-del{width:70px;flex:none;text-align:right}

  /* nomes nunca cortam: em telas estreitas o nome fica na sua própria linha */
  @media (max-width:640px){
    .player-row{flex-wrap:wrap}
    .player-row .c-name{flex:1 1 100%}
  }

  .switch{position:relative;width:38px;height:22px;flex:none}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .switch .track{
    position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line-strong);
    border-radius:999px;transition:background .15s;
  }
  .switch .thumb{
    position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:var(--ink-dim);transition:transform .15s,background .15s;
  }
  .switch input:checked + .track{background:var(--pitch);border-color:var(--pitch)}
  .switch input:checked + .track + .thumb{transform:translateX(16px);background:#fff}
  .switch input:focus-visible + .track{outline:2px solid var(--pitch);outline-offset:2px}

  .del-btn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;
  }
  .del-btn:hover{border-color:var(--danger);color:var(--danger)}
  .del-btn.confirm{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}

  .empty-state{padding:34px 20px;text-align:center;color:var(--ink-dim);font-size:14.5px}

  /* ---------- sortear ---------- */
  .draw-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:28px 0 6px}
  .draw-bar .hint{font-size:13px;color:var(--ink-dim)}
  .draw-actions{display:flex;gap:10px;flex-wrap:wrap}

  .draw-meta{font-size:12.5px;color:var(--ink-dim);margin-top:10px}
  .teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
  .team-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .team-card .head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .team-card .name{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:19px}
  .team-card.a .name{color:var(--team-a)} .team-card.a .head{background:var(--team-a-soft)}
  .team-card.b .name{color:var(--team-b)} .team-card.b .head{background:var(--team-b-soft)}
  .team-card.c .name{color:var(--team-c)} .team-card.c .head{background:var(--team-c-soft)}
  .team-card .total{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--ink-dim)}
  .team-card ul{list-style:none;margin:0;padding:6px 0}
  .team-card li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 16px;font-size:14.5px;font-weight:500}
  .team-card li .st{display:flex;gap:1px;flex:none}
  .team-card li .st svg{width:12px;height:12px}
  .order-note{grid-column:1/-1;font-size:13px;color:var(--ink-dim);padding:12px 16px;background:var(--surface-2);border-radius:10px;margin-top:2px}
  .order-note b{color:var(--ink)}

  footer{margin-top:40px;font-size:12px;color:var(--ink-dim);text-align:center}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;
    padding:11px 18px;border-radius:9px;box-shadow:var(--shadow);
    max-width:90vw;text-align:center;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <svg class="ball" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="var(--pitch)" stroke-width="2.4"/>
        <path d="M24 13.5 31 19l-2.7 8.4h-8.6L17 19z" fill="var(--pitch)"/>
        <path d="M24 13.5 17 19M24 13.5 31 19M17 19l-8 2.6M17 19l1.6 6.4M31 19l8 2.6M31 19l-1.6 6.4M28.3 27.4 24 34l-4.3-6.6M9 21.6l4 12.4h6M39 21.6l-4 12.4h-6" fill="none" stroke="var(--pitch)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Escalação</h1>
        <p class="tagline">5×5 · <b>3 times</b> no rodízio · quem perde sai</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">cadastrados</div></div>
      <div class="stat"><div class="n" id="statActive">0</div><div class="l">ativos hoje</div></div>
    </div>
  </header>

  <div class="panel cash-card" id="cashCard"></div>

  <div class="admin-bar" id="adminBar"></div>

  <div id="banner"></div>

  <div class="panel">
    <form class="add-form" id="addForm">
      <input type="text" id="newName" placeholder="Nome do jogador" autocomplete="off" maxlength="40" required>
      <div class="stars-pick" id="newStars" aria-label="Nota do jogador"></div>
      <button class="btn" type="submit">Adicionar</button>
    </form>
  </div>

  <div class="roster-head">
    <h2>Jogadores</h2>
    <span class="example-tag" id="exampleTag" hidden>exemplo — comece cadastrando os seus</span>
  </div>

  <div class="panel">
    <div class="row-head">
      <div class="c-name">Nome</div>
      <div class="c-stars">Estrelas</div>
      <div class="c-trend">Forma</div>
      <div class="c-active">Ativo</div>
      <div class="c-del"></div>
    </div>
    <div id="roster"></div>
  </div>

  <div class="draw-bar">
    <div class="draw-actions">
      <button class="btn" id="drawBtn">Sortear times</button>
      <button class="btn ghost" id="copyBtn" hidden type="button">Copiar pra WhatsApp</button>
    </div>
    <span class="hint" id="drawHint"></span>
  </div>

  <div id="teamsOut"></div>

  <footer>Os dados ficam salvos no servidor — abra o mesmo link em qualquer aparelho.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var API_URL = "/api/players";
  var TEAM_NAMES = ["Time A","Time B","Time C"];
  var TEAM_CLASS = ["a","b","c"];

  // ---------- toast ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 3200);
  }

  // ---------- dinheiro (R$) ----------
  function formatBRL(cents){
    var v = (cents || 0) / 100;
    try {
      return "R$ " + v.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
    } catch(e){
      return "R$ " + v.toFixed(2).replace(".", ",");
    }
  }
  function parseBRL(str){
    var s = String(str || "").trim();
    s = s.replace(/[^0-9.,]/g, "");
    if (s === "") return null;
    if (s.indexOf(",") !== -1){
      s = s.replace(/\./g, "");
      s = s.replace(",", ".");
    }
    var n = parseFloat(s);
    if (isNaN(n) || n < 0) return null;
    return Math.round(n * 100);
  }

  // ---------- API ----------
  function apiCall(payload){
    return fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(json){
        if (!res.ok){
          var err = new Error((json && json.error) || ("http_"+res.status));
          err.status = res.status;
          throw err;
        }
        return json;
      });
    });
  }

  // ---------- admin gate (senha verificada pelo servidor, não pelo navegador) ----------
  var adminPassword = null;
  try { adminPassword = window.localStorage && localStorage.getItem("pelada_admin_pw"); } catch(e){}
  var isAdmin = !!adminPassword;
  var adminFormOpen = false;
  var cashEditing = false;

  function setAdmin(v, pw){
    isAdmin = v;
    adminPassword = v ? pw : null;
    try {
      if (v) localStorage.setItem("pelada_admin_pw", pw);
      else localStorage.removeItem("pelada_admin_pw");
    } catch(e){}
    adminFormOpen = false;
    render();
  }

  function renderAdminBar(){
    var bar = document.getElementById("adminBar");
    bar.innerHTML = "";
    if (isAdmin){
      var pill = document.createElement("div");
      pill.className = "admin-pill";
      pill.innerHTML = '<span class="dot"></span><span>Modo administrador</span>';
      var out = document.createElement("button");
      out.type = "button"; out.className = "link-btn"; out.textContent = "Sair";
      out.style.marginLeft = "4px";
      out.addEventListener("click", function(){ setAdmin(false, null); });
      pill.appendChild(out);
      bar.appendChild(pill);
    } else if (adminFormOpen){
      var form = document.createElement("form");
      form.className = "admin-form";
      form.innerHTML = '<input type="password" id="adminPassInput" placeholder="Senha de admin" autocomplete="current-password">'+
        '<button class="btn small" type="submit">Entrar</button>'+
        '<button class="btn ghost small" type="button" id="adminCancelBtn">Cancelar</button>';
      form.addEventListener("submit", function(ev){
        ev.preventDefault();
        var val = form.querySelector("#adminPassInput").value;
        apiCall({action:"auth_check", password: val}).then(function(){
          setAdmin(true, val);
        }).catch(function(err){
          if (err && err.status === 403) showToast("Senha incorreta.");
          else showToast("Não foi possível verificar agora. Tente de novo.");
        });
      });
      form.querySelector("#adminCancelBtn").addEventListener("click", function(){ adminFormOpen = false; render(); });
      bar.appendChild(form);
      setTimeout(function(){ var i=document.getElementById("adminPassInput"); if(i) i.focus(); }, 0);
    } else {
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "link-btn"; btn.textContent = "Entrar como admin";
      btn.addEventListener("click", function(){ adminFormOpen = true; render(); });
      bar.appendChild(btn);
    }
  }

  function renderCash(){
    var el = document.getElementById("cashCard");
    if (!store.ready){ el.innerHTML = ""; return; }
    var cash = store.cash || {amountCents:0, updatedAt:null};
    el.innerHTML = "";
    var inner = document.createElement("div");
    inner.className = "cash-inner";

    if (cashEditing){
      inner.innerHTML = '<div class="cash-label">Caixa da pelada</div>';
      var form = document.createElement("form");
      form.className = "cash-edit-form";
      form.innerHTML = '<span class="cash-prefix">R$</span>'+
        '<input type="text" id="cashInput" inputmode="decimal" placeholder="0,00">'+
        '<button class="btn small" type="submit">Salvar</button>'+
        '<button class="btn ghost small" type="button" id="cashCancelBtn">Cancelar</button>';
      inner.appendChild(form);
      el.appendChild(inner);
      var input = form.querySelector("#cashInput");
      input.value = ((cash.amountCents||0)/100).toFixed(2).replace(".", ",");
      setTimeout(function(){ input.focus(); input.select(); }, 0);
      form.addEventListener("submit", function(ev){
        ev.preventDefault();
        var cents = parseBRL(input.value);
        if (cents === null){ showToast("Valor inválido — digite algo como 665,20."); return; }
        cashEditing = false;
        store.setCash(cents);
      });
      form.querySelector("#cashCancelBtn").addEventListener("click", function(){ cashEditing = false; render(); });
    } else {
      var updatedTxt = cash.updatedAt ? new Date(cash.updatedAt).toLocaleDateString("pt-BR") : "—";
      inner.innerHTML = '<div class="cash-label">Caixa da pelada</div>'+
        '<div class="cash-value">'+formatBRL(cash.amountCents)+'</div>'+
        '<div class="cash-meta">atualizado em '+updatedTxt+'</div>';
      if (isAdmin){
        var editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "link-btn cash-edit-btn";
        editBtn.textContent = "Editar valor";
        editBtn.addEventListener("click", function(){ cashEditing = true; render(); });
        inner.appendChild(editBtn);
      }
      el.appendChild(inner);
    }
  }

  function handleApiError(err){
    if (err && err.status === 403){
      showToast("Sessão de administrador expirada — entre novamente.");
      setAdmin(false, null);
    } else {
      showToast("Não foi possível salvar agora. Confira sua internet e tente de novo.");
    }
    if (window.console) console.error("Escalação: falha na chamada", err);
  }

  // ---------- star svg ----------
  function starSvg(filled){
    return '<svg viewBox="0 0 24 24"><path class="'+(filled?'fill':'empty')+
      '" d="M12 2.8l2.7 6.2 6.7.6-5.1 4.5 1.6 6.6L12 17.3l-5.9 3.4 1.6-6.6-5.1-4.5 6.7-.6z"/></svg>';
  }
  function renderStarPicker(container, value, interactive, onChange){
    container.innerHTML = "";
    for (var i=1; i<=7; i++){
      (function(n){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "star-btn";
        b.setAttribute("aria-label", n+" estrela"+(n>1?"s":""));
        if (!interactive) b.disabled = true;
        b.innerHTML = starSvg(n <= value);
        if (interactive){
          b.addEventListener("click", function(){ onChange(n); });
        }
        container.appendChild(b);
      })(i);
    }
  }

  // ---------- store (fala com /api/players, uma Cloudflare Pages Function) ----------
  var store = {
    ready:false, online:false,
    players:[],
    cash:{amountCents:0, updatedAt:null},
    listeners:[],
    onChange:function(fn){ this.listeners.push(fn); },
    emit:function(){ this.listeners.forEach(function(fn){ fn(); }); },
    load:function(){
      var self = this;
      return apiCall({action:"list"}).then(function(res){
        self.players = res.players || [];
        self.cash = res.cash || {amountCents:0, updatedAt:null};
        self.online = true;
      }).catch(function(){
        self.online = false;
      }).then(function(){
        self.ready = true;
        self.emit();
      });
    },
    add:function(data){
      var self = this;
      return apiCall(Object.assign({action:"add", password: adminPassword}, data)).then(function(res){
        self.players = res.players;
        self.emit();
      }).catch(handleApiError);
    },
    update:function(id, patch){
      var self = this;
      return apiCall(Object.assign({action:"update", id:id, password: adminPassword}, patch)).then(function(res){
        self.players = res.players;
        self.emit();
      }).catch(handleApiError);
    },
    remove:function(id){
      var self = this;
      return apiCall({action:"remove", id:id, password: adminPassword}).then(function(res){
        self.players = res.players;
        self.emit();
      }).catch(handleApiError);
    },
    setCash:function(amountCents){
      var self = this;
      return apiCall({action:"cash_set", amountCents:amountCents, password: adminPassword}).then(function(res){
        self.cash = res.cash;
        self.emit();
      }).catch(handleApiError);
    }
  };

  // ---------- example (não salvo) exibido só até existir cadastro real ----------
  var EXAMPLE = [
    {id:"ex1",name:"Bruno",stars:6,active:true},
    {id:"ex2",name:"João",stars:5,active:true},
    {id:"ex3",name:"Rafael",stars:7,active:true},
    {id:"ex4",name:"Diego",stars:4,active:true},
    {id:"ex5",name:"Lucas",stars:5,active:true},
    {id:"ex6",name:"Thiago",stars:3,active:true},
    {id:"ex7",name:"Matheus",stars:6,active:true},
    {id:"ex8",name:"Felipe",stars:4,active:false},
    {id:"ex9",name:"André",stars:5,active:true},
    {id:"ex10",name:"Caio",stars:2,active:true},
    {id:"ex11",name:"Gustavo",stars:6,active:true},
    {id:"ex12",name:"Renato",stars:4,active:true},
    {id:"ex13",name:"Vitor",stars:5,active:true},
    {id:"ex14",name:"Pedro",stars:3,active:false},
    {id:"ex15",name:"Marcelo",stars:5,active:true}
  ];

  // ---------- team draw ----------
  function shuffle(arr){
    for (var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function drawTeams(active){
    var n = active.length;
    var base = Math.floor(n/3), rem = n%3;
    var caps = [base,base,base];
    var order = shuffle([0,1,2]);
    for (var r=0;r<rem;r++) caps[order[r]] += 1;

    var pool = active.slice();
    shuffle(pool);
    pool.sort(function(a,b){ return b.stars - a.stars; });

    var teams = [[],[],[]], sums=[0,0,0];
    var startIdx = Math.floor(Math.random()*3);
    pool.forEach(function(p){
      var best = -1, bestSum = Infinity;
      for (var k=0;k<3;k++){
        var i = (startIdx+k)%3;
        if (teams[i].length < caps[i] && sums[i] < bestSum){ bestSum = sums[i]; best = i; }
      }
      if (best === -1){
        for (var k2=0;k2<3;k2++){ if (teams[k2].length < caps[k2]) { best = k2; break; } }
      }
      if (best === -1) best = 0;
      teams[best].push(p);
      sums[best] += p.stars;
    });
    return teams.map(function(t,i){
      t.sort(function(a,b){ return b.stars - a.stars; });
      return { name:TEAM_NAMES[i], cls:TEAM_CLASS[i], players:t, total: t.reduce(function(s,p){return s+p.stars;},0) };
    });
  }

  // ---------- render ----------
  var els = {
    banner: document.getElementById("banner"),
    roster: document.getElementById("roster"),
    statTotal: document.getElementById("statTotal"),
    statActive: document.getElementById("statActive"),
    exampleTag: document.getElementById("exampleTag"),
    drawBtn: document.getElementById("drawBtn"),
    copyBtn: document.getElementById("copyBtn"),
    drawHint: document.getElementById("drawHint"),
    rowHead: document.querySelector(".row-head"),
    teamsOut: document.getElementById("teamsOut"),
    newStars: document.getElementById("newStars"),
    newName: document.getElementById("newName"),
    addForm: document.getElementById("addForm")
  };

  var newStarsValue = 4;
  function bindNewStars(){
    renderStarPicker(els.newStars, newStarsValue, true, function(n){ newStarsValue = n; bindNewStars(); });
  }
  bindNewStars();

  var LAST_DRAW_KEY = "pelada_last_draw_v1";
  var lastTeams = null;
  var lastDrawTs = null;
  try {
    var savedDraw = window.localStorage && localStorage.getItem(LAST_DRAW_KEY);
    if (savedDraw){
      var parsed = JSON.parse(savedDraw);
      lastTeams = parsed.teams || null;
      lastDrawTs = parsed.ts || null;
    }
  } catch(e){}
  function saveLastTeams(teams){
    lastTeams = teams;
    lastDrawTs = teams ? Date.now() : null;
    try {
      if (window.localStorage){
        if (teams) localStorage.setItem(LAST_DRAW_KEY, JSON.stringify({teams:teams, ts:lastDrawTs}));
        else localStorage.removeItem(LAST_DRAW_KEY);
      }
    } catch(e){}
  }
  var confirmDeleteId = null;

  function usingExamples(){ return store.ready && store.players.length === 0; }

  function render(){
    var data = usingExamples() ? EXAMPLE : store.players;
    var isExample = usingExamples();
    var addLocked = !isAdmin;
    var locked = isExample || addLocked;

    els.exampleTag.hidden = !isExample;
    renderAdminBar();
    renderCash();

    // banner
    if (!store.ready){
      els.banner.innerHTML = "";
    } else if (!store.online){
      els.banner.innerHTML = '<div class="banner offline"><strong>Sem conexão com o servidor.</strong> Não foi possível falar com /api/players — confira se o KV foi vinculado certinho (veja o LEIA-ME).</div>';
    } else if (!isAdmin){
      els.banner.innerHTML = '<div class="banner"><strong>Modo visualização.</strong> Você pode ver a escalação e sortear times. Pra cadastrar, editar ou remover jogadores, entre como administrador ali em cima.</div>';
    } else {
      els.banner.innerHTML = "";
    }

    els.newName.disabled = addLocked;
    els.addForm.querySelector("button[type=submit]").disabled = addLocked;

    els.statTotal.textContent = isExample ? "–" : store.players.length;
    els.statActive.textContent = isExample ? "–" : store.players.filter(function(p){return p.active;}).length;

    // colunas de "Ativo"/remover só aparecem pra quem está logado como admin
    var activeHead = els.rowHead ? els.rowHead.querySelector(".c-active") : null;
    var delHead = els.rowHead ? els.rowHead.querySelector(".c-del") : null;
    var trendHead = els.rowHead ? els.rowHead.querySelector(".c-trend") : null;
    if (activeHead) activeHead.hidden = !isAdmin;
    if (delHead) delHead.hidden = !isAdmin;
    if (trendHead) trendHead.hidden = !isAdmin;

    // sempre do mais estrelado pro menos estrelado — fica mais fácil de ler
    data = data.slice().sort(function(a,b){ return b.stars - a.stars; });

    els.roster.innerHTML = "";
    if (data.length === 0){
      var e = document.createElement("div");
      e.className = "empty-state";
      e.textContent = "Nenhum jogador cadastrado ainda. Adicione o primeiro acima.";
      els.roster.appendChild(e);
    } else {
      data.forEach(function(p){
        var row = document.createElement("div");
        row.className = "player-row" + (p.active ? "" : " inactive");

        var cName = document.createElement("div");
        cName.className = "c-name";
        var input = document.createElement("input");
        input.className = "p-name-input";
        input.type = "text";
        input.value = p.name;
        input.maxLength = 40;
        input.disabled = locked;
        input.addEventListener("change", function(){
          var v = input.value.trim();
          if (v && v !== p.name) store.update(p.id, {name:v});
          else input.value = p.name;
        });
        cName.appendChild(input);
        if (p.trend === "up" || p.trend === "down"){
          var badge = document.createElement("span");
          badge.className = "trend-badge " + p.trend;
          badge.title = p.trend === "up" ? "Em ascensão" : "Em queda";
          badge.textContent = p.trend === "up" ? "▲▲" : "▼▼";
          cName.appendChild(badge);
        }

        var cStars = document.createElement("div");
        cStars.className = "c-stars";
        renderStarPicker(cStars, p.stars, !locked, function(n){ store.update(p.id, {stars:n}); });

        row.appendChild(cName); row.appendChild(cStars);

        // ativar/desativar, remover e marcar a forma (setinhas) só aparecem pra
        // quem está logado como admin — pra quem só está vendo/sorteando,
        // esses controles nem existem na tela.
        if (isAdmin){
          var cTrend = document.createElement("div");
          cTrend.className = "c-trend";
          var trendWrap = document.createElement("div");
          trendWrap.className = "trend-picker";
          ["down","up"].forEach(function(kind){
            var tb = document.createElement("button");
            tb.type = "button";
            tb.className = "trend-btn " + kind + (p.trend === kind ? " active" : "");
            tb.textContent = kind === "up" ? "▲" : "▼";
            tb.title = kind === "up" ? "Marcar em ascensão" : "Marcar em queda";
            tb.disabled = locked;
            tb.addEventListener("click", function(){
              store.update(p.id, {trend: p.trend === kind ? null : kind});
            });
            trendWrap.appendChild(tb);
          });
          cTrend.appendChild(trendWrap);
          row.appendChild(cTrend);

          var cActive = document.createElement("div");
          cActive.className = "c-active";
          var sw = document.createElement("label");
          sw.className = "switch";
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!p.active;
          cb.disabled = locked;
          cb.addEventListener("change", function(){ store.update(p.id, {active: cb.checked}); });
          var track = document.createElement("span"); track.className="track";
          var thumb = document.createElement("span"); thumb.className="thumb";
          sw.appendChild(cb); sw.appendChild(track); sw.appendChild(thumb);
          cActive.appendChild(sw);

          var cDel = document.createElement("div");
          cDel.className = "c-del";
          var delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "del-btn" + (confirmDeleteId === p.id ? " confirm" : "");
          delBtn.textContent = confirmDeleteId === p.id ? "Confirmar" : "Remover";
          delBtn.disabled = locked;
          delBtn.addEventListener("click", function(){
            if (confirmDeleteId === p.id){ confirmDeleteId = null; store.remove(p.id); render(); }
            else { confirmDeleteId = p.id; render(); setTimeout(function(){ if(confirmDeleteId===p.id){confirmDeleteId=null; render();} }, 3000); }
          });
          cDel.appendChild(delBtn);

          row.appendChild(cActive); row.appendChild(cDel);
        }

        els.roster.appendChild(row);
      });
    }

    var activeList = data.filter(function(p){return p.active;});
    els.drawBtn.disabled = activeList.length < 3;
    if (activeList.length < 3){
      els.drawHint.textContent = "Ative pelo menos 3 jogadores para sortear.";
    } else if (activeList.length !== 15){
      els.drawHint.textContent = activeList.length + " ativos — ideal são 15 (5 por time). Times ficam com tamanhos próximos.";
    } else {
      els.drawHint.textContent = "15 ativos — condição perfeita para 3 times de 5.";
    }

    els.copyBtn.hidden = !lastTeams;
    renderTeams(isExample);
  }

  function renderTeams(isExample){
    if (!lastTeams){ els.teamsOut.innerHTML = ""; return; }
    var html = "";
    if (lastDrawTs && !isExample){
      var ts = new Date(lastDrawTs).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
      html += '<div class="draw-meta">Sorteado em '+ts+' · <button type="button" class="link-btn" id="clearDrawBtn">limpar sorteio</button></div>';
    }
    html += '<div class="teams">';
    lastTeams.forEach(function(t){
      html += '<div class="team-card '+t.cls+'"><div class="head"><span class="name">'+t.name+'</span><span class="total">'+t.total+' ★ total</span></div><ul>';
      t.players.forEach(function(p){
        html += '<li><span>'+escapeHtml(p.name)+'</span><span class="st">'+starRow(p.stars)+'</span></li>';
      });
      html += '</ul></div>';
    });
    html += '<div class="order-note"><b>Ordem sugerida:</b> '+lastTeams[0].name+' × '+lastTeams[1].name+' primeiro, '+lastTeams[2].name+' descansa. Quem perde sai; o time de fora entra.'+(isExample?' <i>(exemplo)</i>':'')+'</div>';
    html += '</div>';
    els.teamsOut.innerHTML = html;
    var clearBtn = document.getElementById("clearDrawBtn");
    if (clearBtn) clearBtn.addEventListener("click", function(){
      saveLastTeams(null);
      els.copyBtn.hidden = true;
      renderTeams(isExample);
    });
  }

  function starRow(n){
    var s = "";
    for (var i=1;i<=n;i++) s += starSvg(true).replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="12" height="12"');
    return s;
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }

  // ---------- events ----------
  els.addForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = els.newName.value.trim();
    if (!name) return;
    store.add({ name:name, stars:newStarsValue });
    els.newName.value = "";
    newStarsValue = 4;
    bindNewStars();
    els.newName.focus();
  });

  els.drawBtn.addEventListener("click", function(){
    var data = usingExamples() ? EXAMPLE : store.players;
    var activeList = data.filter(function(p){return p.active;});
    if (activeList.length < 3) return;
    saveLastTeams(drawTeams(activeList));
    renderTeams(usingExamples());
    els.copyBtn.hidden = false;
    els.teamsOut.scrollIntoView({behavior:"smooth", block:"nearest"});
  });

  function formatTeamsForShare(teams){
    var lines = ["*ESCALAÇÃO*", "5×5 · 3 times no rodízio"];
    teams.forEach(function(t){
      lines.push("");
      lines.push("*" + t.name.toUpperCase() + "*" + (t.total ? " (" + t.total + "★)" : ""));
      t.players.forEach(function(p, i){
        lines.push((i+1) + ". " + p.name + " " + "★".repeat(p.stars));
      });
    });
    if (teams.length >= 3){
      lines.push("");
      lines.push(teams[0].name + " × " + teams[1].name + " primeiro, " + teams[2].name + " descansa. Quem perde sai, quem descansa entra.");
    }
    return lines.join("\n");
  }

  function copyTeamsToClipboard(){
    if (!lastTeams) return;
    var text = formatTeamsForShare(lastTeams);
    function done(ok){ showToast(ok ? "Copiado! Cole no grupo do WhatsApp." : "Não deu pra copiar automaticamente — selecione o texto manualmente."); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, cb){
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      cb(ok);
    } catch(e){ cb(false); }
  }
  els.copyBtn.addEventListener("click", copyTeamsToClipboard);

  store.onChange(function(){ render(); });

  render();
  store.load();

  // Reconsulta o servidor de tempos em tempos, pra pegar mudanças feitas
  // por outro admin (ou em outro aparelho) sem precisar recarregar a página.
  setInterval(function(){ store.load(); }, 20000);
})();
</script>
